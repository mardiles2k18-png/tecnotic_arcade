name: Controller Studio demo para Windows

on:
  push:
    branches:
      - codex/demo-mandos
    paths:
      - 'retrobat/controller_studio/**'
      - '.github/workflows/controller-studio-demo.yml'

permissions:
  contents: read

jobs:
  demo:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: x64
      - name: Compilar la demo independiente
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check PyInstaller==6.22.3
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m PyInstaller --noconfirm --clean --onefile --windowed --paths retrobat `
            --name Tecnotics-Controller-Studio-Demo retrobat/controller_studio/portable.py
          exit $LASTEXITCODE
      - name: Verificar la ventana y los dos modos del ejecutable
        shell: pwsh
        run: |
          $exe = Get-Item -LiteralPath 'dist/Tecnotics-Controller-Studio-Demo.exe'
          $informe = Join-Path $env:RUNNER_TEMP 'controller-studio-verificacion.txt'
          $proceso = Start-Process -FilePath $exe.FullName -ArgumentList "--verificar `"$informe`"" -PassThru
          if (-not $proceso.WaitForExit(60000)) {
              Stop-Process -Id $proceso.Id
              throw 'La demo no terminó la verificación.'
          }
          if ($proceso.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $informe)) {
              if (Test-Path -LiteralPath $informe) { Get-Content -LiteralPath $informe }
              throw 'La demo no pasó la verificación.'
          }
          if ((Get-Content -LiteralPath $informe -Raw).Trim() -ne 'OK') { throw 'Resultado de verificación inesperado.' }
          $hash = (Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$($exe.FullName).sha256.txt" -Value "$hash  $($exe.Name)" -Encoding ascii
      - uses: actions/upload-artifact@v7
        with:
          name: Tecnotics-Controller-Studio-Demo-Windows-x64
          path: dist/Tecnotics-Controller-Studio-Demo.exe*
          if-no-files-found: error
          retention-days: 30
